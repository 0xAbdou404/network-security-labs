server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
}

server{
    listen 443 ssl;
    server_name localhost;

    ssl_certificate /etc/nginx/certs/example.crt;
    ssl_certificate_key /etc/nginx/certs/example.key;
    root /usr/share/nginx/html;
    index index.html;
}